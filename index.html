<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vivid - AI Presentation Platform</title>
    
    <!-- Google Fonts for Professional Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&family=Roboto:wght@400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: 'hsl(var(--background))',
              foreground: 'hsl(var(--foreground))',
              card: 'hsl(var(--card))',
              'card-foreground': 'hsl(var(--card-foreground))',
              popover: 'hsl(var(--popover))',
              'popover-foreground': 'hsl(var(--popover-foreground))',
              primary: 'hsl(var(--primary))',
              'primary-foreground': 'hsl(var(--primary-foreground))',
              secondary: 'hsl(var(--secondary))',
              'secondary-foreground': 'hsl(var(--secondary-foreground))',
              muted: 'hsl(var(--muted))',
              'muted-foreground': 'hsl(var(--muted-foreground))',
              accent: 'hsl(var(--accent))',
              'accent-foreground': 'hsl(var(--accent-foreground))',
              destructive: 'hsl(var(--destructive))',
              'destructive-foreground': 'hsl(var(--destructive-foreground))',
              border: 'hsl(var(--border))',
              input: 'hsl(var(--input))',
              ring: 'hsl(var(--ring))',
            },
            borderRadius: {
              lg: 'var(--radius)',
              md: 'calc(var(--radius) - 2px)',
              sm: 'calc(var(--radius) - 4px)',
            },
            fontFamily: {
                sans: ['Inter', 'sans-serif'],
            }
          },
        },
      }
    </script>
    <style type="text/tailwindcss">
      @layer base {
        :root {
          --background: 240 10% 3.9%;
          --foreground: 0 0% 98%;
          --card: 240 10% 3.9%;
          --card-foreground: 0 0% 98%;
          --popover: 240 10% 3.9%;
          --popover-foreground: 0 0% 98%;
          --primary: 0 0% 98%;
          --primary-foreground: 240 5.9% 10%;
          --secondary: 240 3.7% 15.9%;
          --secondary-foreground: 0 0% 98%;
          --muted: 240 3.7% 15.9%;
          --muted-foreground: 240 5% 64.9%;
          --accent: 240 3.7% 15.9%;
          --accent-foreground: 0 0% 98%;
          --destructive: 0 62.8% 30.6%;
          --destructive-foreground: 0 0% 98%;
          --border: 240 3.7% 15.9%;
          --input: 240 3.7% 15.9%;
          --ring: 240 4.9% 83.9%;
          --radius: 0.75rem;
          
          /* Vivid Slides Package Theme Variables */
          --vivid-primary: #8b5cf6;
          --vivid-primary-hover: #7c3aed;
          --vivid-background: #0f172a;
          --vivid-surface: #1e293b;
          --vivid-surface-hover: #334155;
          --vivid-border: #334155;
          --vivid-text-primary: #f8fafc;
          --vivid-text-secondary: #94a3b8;
          --vivid-text-muted: #64748b;
          --vivid-font-body: 'Inter', system-ui, sans-serif;
          --vivid-font-heading: 'Inter', system-ui, sans-serif;
          --vivid-radius-sm: 4px;
          --vivid-radius-md: 8px;
          --vivid-radius-lg: 12px;
        }
        /* Custom Scrollbar for editor rails */
        ::-webkit-scrollbar {
          width: 8px;
          height: 8px;
        }
        ::-webkit-scrollbar-track {
          background: transparent;
        }
        ::-webkit-scrollbar-thumb {
          background: hsl(var(--border));
          border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: hsl(var(--muted-foreground));
        }
        
        /* Force basic formatting to override Tailwind Reset if prose is missing or incomplete */
        b, strong {
          font-weight: bold;
        }
        i, em {
          font-style: italic;
        }
        
        .tiptap ul {
            list-style-type: disc;
            padding-left: 1.5em;
        }
        .tiptap ol {
            list-style-type: decimal;
            padding-left: 1.5em;
        }
        .tiptap a {
            color: #3b82f6;
            text-decoration: underline;
            cursor: pointer;
        }
      }
      
      @layer utilities {
        .text-gradient {
            @apply bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-violet-500;
        }
        .canvas-grid {
             background-size: 40px 40px;
             background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
        /* Tiptap Essentials */
        .tiptap {
          outline: none !important;
          height: 100%;
        }
        .tiptap p.is-editor-empty:first-child::before {
          color: #adb5bd;
          content: attr(data-placeholder);
          float: left;
          height: 0;
          pointer-events: none;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",

    "@tiptap/react": "https://esm.sh/@tiptap/react@2.2.4?deps=react@18.2.0,react-dom@18.2.0",
    "@tiptap/starter-kit": "https://esm.sh/@tiptap/starter-kit@2.2.4?deps=react@18.2.0,react-dom@18.2.0",
    "@tiptap/extension-placeholder": "https://esm.sh/@tiptap/extension-placeholder@2.2.4?deps=react@18.2.0,react-dom@18.2.0",
    "@tiptap/extension-text-align": "https://esm.sh/@tiptap/extension-text-align@2.2.4?deps=react@18.2.0,react-dom@18.2.0",
    "@tiptap/extension-text-style": "https://esm.sh/@tiptap/extension-text-style@2.2.4?deps=react@18.2.0,react-dom@18.2.0",
    "@tiptap/extension-color": "https://esm.sh/@tiptap/extension-color@2.2.4?deps=react@18.2.0,react-dom@18.2.0",
    "@tiptap/extension-font-family": "https://esm.sh/@tiptap/extension-font-family@2.2.4?deps=react@18.2.0,react-dom@18.2.0",
    "@tiptap/extension-highlight": "https://esm.sh/@tiptap/extension-highlight@2.2.4?deps=react@18.2.0,react-dom@18.2.0",
    "@tiptap/extension-underline": "https://esm.sh/@tiptap/extension-underline@2.2.4?deps=react@18.2.0,react-dom@18.2.0",
    "@tiptap/extension-list-item": "https://esm.sh/@tiptap/extension-list-item@2.2.4?deps=react@18.2.0,react-dom@18.2.0",
    "@tiptap/extension-link": "https://esm.sh/@tiptap/extension-link@2.2.4?deps=react@18.2.0,react-dom@18.2.0",
    "@tiptap/extension-subscript": "https://esm.sh/@tiptap/extension-subscript@2.2.4?deps=react@18.2.0,react-dom@18.2.0",
    "@tiptap/extension-superscript": "https://esm.sh/@tiptap/extension-superscript@2.2.4?deps=react@18.2.0,react-dom@18.2.0",
    "@tiptap/core": "https://esm.sh/@tiptap/core@2.2.4?deps=react@18.2.0,react-dom@18.2.0",
    "prosemirror-state": "https://esm.sh/prosemirror-state@1.4.3",
    "prosemirror-view": "https://esm.sh/prosemirror-view@1.31.7",
    "prosemirror-model": "https://esm.sh/prosemirror-model@1.19.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background text-foreground antialiased h-screen overflow-hidden">
    <div id="root" class="h-full"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
